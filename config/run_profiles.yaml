# Built-in Repository Workspace run-profile templates.
# Executables + argument arrays only — never raw shell strings.
# Allowed placeholders: {port}, {repository_path}, {environment}
#
# Repository-specific profiles created in Settings → Run Profiles are stored in
# SQLite (data/repository_workspace.db) and override these templates by profile id.
# Do not rewrite this file for every UI-created profile.
#
# Environment variable *values* are read server-side from the process environment
# for names listed in allowed_env_names. The UI shows names only.

profiles:
  - id: python-http
    name: Python HTTP Server
    description: "stdlib http.server for local static preview (development only)."
    repository_ids: []   # empty = available to any local checkout
    executable: python
    args: ["-m", "http.server", "{port}"]
    working_directory: "{repository_path}"
    environments: ["development"]
    port_mode: argument
    default_port: 8765
    local_url: "http://127.0.0.1:{port}/"
    health_url: "http://127.0.0.1:{port}/"
    startup_timeout_seconds: 15
    allowed_env_names: []
    live_profile: false
    provides_api: false
    write_capable: false

  - id: flask-dev
    name: Flask development server
    description: "Example Flask profile. Set FLASK_APP in the hub environment."
    repository_ids: ["live-processing-local"]
    executable: python
    args: ["-m", "flask", "run", "--host", "127.0.0.1", "--port", "{port}"]
    working_directory: "{repository_path}"
    environments: ["development", "stage"]
    port_mode: argument
    default_port: 5050
    port_env: null
    local_url: "http://127.0.0.1:{port}/"
    health_url: "http://127.0.0.1:{port}/health"
    startup_timeout_seconds: 45
    allowed_env_names: ["FLASK_APP", "FLASK_ENV", "FLASK_DEBUG"]
    live_profile: false
    provides_api: true
    write_capable: false

  - id: fastapi-uvicorn
    name: FastAPI (uvicorn)
    description: "Example ASGI app via uvicorn. Adjust module path per repository."
    repository_ids: []
    executable: python
    args: ["-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "{port}"]
    working_directory: "{repository_path}"
    environments: ["development", "stage"]
    port_mode: argument
    default_port: 8000
    local_url: "http://127.0.0.1:{port}/"
    health_url: "http://127.0.0.1:{port}/docs"
    startup_timeout_seconds: 45
    allowed_env_names: []
    live_profile: false
    provides_api: true
    write_capable: false

  - id: node-dev
    name: Node development server
    description: "Example Node profile using npm. Requires npm on PATH."
    repository_ids: []
    executable: npm
    args: ["run", "dev", "--", "--port", "{port}"]
    working_directory: "{repository_path}"
    environments: ["development"]
    port_mode: argument
    default_port: 3000
    local_url: "http://127.0.0.1:{port}/"
    health_url: "http://127.0.0.1:{port}/"
    startup_timeout_seconds: 60
    allowed_env_names: ["NODE_ENV"]
    live_profile: false
    provides_api: false
    write_capable: false

  - id: pmnp-live-processing
    name: PMNP Live Processing — Live
    description: "Example fixed-port live profile. Customize via Settings for a real checkout."
    repository_ids: ["live-processing-local"]
    executable: python
    args: ["lookup/app_lookup.py", "--environment", "live"]
    working_directory: "{repository_path}"
    environments: ["live"]
    port_mode: fixed
    fixed_port: 5050
    default_port: 5050
    local_url: "http://127.0.0.1:5050/"
    health_url: "http://127.0.0.1:5050/"
    startup_timeout_seconds: 60
    allowed_env_names: []
    live_profile: true
    provides_api: true
    write_capable: false
