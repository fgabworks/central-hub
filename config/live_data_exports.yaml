# Central Hub Live Data Export — approved source registry (Phase 1)
# Users cannot type arbitrary tables/SQL. Only keys listed here are selectable.
# status: verified | unverified | disabled
# Unverified sources stay unavailable until object names and columns are confirmed.

defaults:
  max_rows_sync: 5000
  max_rows_hard: 100000
  preview_rows: 25
  download_ttl_seconds: 86400
  large_export_rows: 5000
  formats: [csv, xlsx, csv_gz]
  connection_by_environment:
    live: live-ro
    stage: stage-ro
    dev: local-demo

sources:
  # --- Local demo (verified for hub tests / offline) ---
  - source_key: demo_household_linelist
    display_name: Demo Household Linelist
    source_type: table
    status: verified
    enabled: true
    description: Hub-local demo table for Live Data Export smoke tests (not production data).
    source_owner: central-hub
    repository: central-hub
    connection_id: local-demo
    schema: main
    object_name: export_demo_household
    description_short: Demo household rows
    allowed_columns:
      - household_id
      - org_unit_uid
      - org_unit_name
      - quarter
      - status
      - ip_flag
      - created_at
    default_columns:
      - household_id
      - org_unit_name
      - quarter
      - status
      - ip_flag
    sensitive_columns: []
    excluded_columns:
      - internal_notes
    required_filters:
      - quarter
    filters_supported:
      - environment
      - quarter
      - organisation_unit
      - status
      - ip_flag
      - columns
      - row_limit
    quarter_column: quarter
    organisation_unit_column: org_unit_uid
    date_column: created_at
    status_column: status
    ip_column: ip_flag
    maximum_rows: 10000
    supported_formats: [csv, xlsx, csv_gz]
    default_sort:
      - column: household_id
        direction: asc
    enabled_environments: [dev, stage, live]

  # --- Production candidates (unverified — unavailable until confirmed) ---
  - source_key: household_linelist
    display_name: Household Linelist
    source_type: view
    status: unverified
    enabled: false
    description: Frequent reporting household linelist. Unavailable until schema/object and columns are verified.
    source_owner: live-processing
    repository: live-processing
    schema: ""
    object_name: ""
    allowed_columns: []
    default_columns: []
    sensitive_columns: []
    excluded_columns: []
    required_filters: [quarter]
    filters_supported: [environment, quarter, organisation_unit, columns, row_limit]
